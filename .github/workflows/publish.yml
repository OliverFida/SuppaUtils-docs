name: Publish
on: workflow_dispatch

jobs:
    build-n-publish:
        runs-on: self-hosted

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install Bun (Windows)
              run: powershell -Command "irm https://bun.sh/install.ps1 | iex"

            - name: Add Bun to PATH
              run: echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Install dependencies
              run: bun install --no-cache

            # - name: Build
            #   run: bun run build

            - name: Log in to GHCR
              run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Build Docker image
              run: docker build --target serve -t ghcr.io/oliverfida/suppautils-docs:latest .

            - name: Push Docker image
              run: docker push ghcr.io/oliverfida/suppautils-docs:latest