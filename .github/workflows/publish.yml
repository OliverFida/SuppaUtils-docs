name: Publish
on: workflow_dispatch

jobs:
    build-n-publish:
        runs-on: self-hosted

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install Bun
              run: curl -fsSL https://bun.sh/install | bash

            - name: Add Bun to PATH
              run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

            - name: Install dependencies
              run: bun install

            - name: Build
              run: bun run build